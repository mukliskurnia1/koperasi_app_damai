<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Login Koperasi Mobile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body { background: linear-gradient(135deg, #198754 0%, #146c43 100%); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    .login-card { background: white; width: 90%; max-width: 400px; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
    .logo-circle { width: 80px; height: 80px; background: #e8f5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; }
    .form-control { border-radius: 12px; padding: 12px 15px; border: 1px solid #ced4da; background-color: #f8f9fa; }
    .btn-login { background-color: #198754; color: white; border-radius: 12px; padding: 12px; font-weight: bold; font-size: 1.1rem; width: 100%; border: none; }
    #loading-spinner { display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-circle"><i class="bi bi-bank2 text-success" style="font-size: 2.5rem;"></i></div>
    <h4 class="fw-bold text-dark mb-1">Koperasi Mobile</h4>
    <p class="text-muted small mb-4">KOPERASI DAMAI JAYA ABADI</p>
    <div class="mb-3 text-start">
      <label class="small fw-bold text-muted ms-1 mb-1">NIK Anggota</label>
      <input type="number" id="nik" class="form-control fw-bold" placeholder="Masukkan NIK">
    </div>
    <div class="mb-4 text-start">
      <label class="small fw-bold text-muted ms-1 mb-1">Password</label>
      <input type="password" id="password" class="form-control fw-bold" placeholder="******">
    </div>
    <button class="btn-login shadow-sm" id="btnSubmit" onclick="prosesLogin()">
      <span id="btn-text">MASUK</span>
      <span id="loading-spinner" class="spinner-border spinner-border-sm" role="status"></span>
    </button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzisKcOy3NFblRA-XvM7cPmVLzjXJFlNfrLXYP2KFQ5isXl8B2yCRZFcADSG6PMvjua/exec";

    function prosesLogin() {
      let nik = document.getElementById('nik').value;
      let password = document.getElementById('password').value;
      
      if(nik === "" || password === "") { alert("Wajib diisi!"); return; }

      document.getElementById('btn-text').style.display = 'none';
      document.getElementById('loading-spinner').style.display = 'inline-block';

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "login_anggota", nik: nik, password: password })
      })
      .then(r => r.json())
      .then(res => {
        if(res.status === "success") {
          // PERUBAHAN: Kita kirim no_anggota ke Kodular, bukan nik lagi
          let payload = "SUKSES||" + res.data.no_anggota + "||" + res.data.nama_anggota + "||" + res.data.must_change_password;
          if (window.AppInventor) window.AppInventor.setWebViewString(payload);
        } else {
          alert(res.message);
          resetTombol();
        }
      }).catch(err => { alert("Error jaringan."); resetTombol(); });
    }

    function resetTombol() {
      document.getElementById('btn-text').style.display = 'inline-block';
      document.getElementById('loading-spinner').style.display = 'none';
    }
  </script>
</body>
</html>
